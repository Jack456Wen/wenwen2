# 是否启用。只影响逻辑服务端。
enabled = true
# 是否减少已冻结实体的距离检查频率。默认关闭；开启后玩家靠近可能延迟恢复。
delayFrozenChecks = false
# 开启上项后生效：距离检查间隔，1～200 tick。默认 10，正常 20 TPS 下约 0.5 秒。
frozenCheckInterval = 10
# SPHERE：三维球形，保持原有行为；CYLINDER：水平半径与垂直高度差分别限制。
distanceMode = "SPHERE"
# 仅 CYLINDER 模式使用，单位：方块。须对同一玩家满足水平与垂直条件。
horizontalDistance = 64.0
verticalDistance = 32.0
# 死亡中的生物继续 tick，确保死亡动画和实体清理完成。
protectDying = true
# 同维度最近非旁观玩家的三维距离，单位：方块。边界内正常 tick。
activationDistance = 64.0
# ALL_NON_PLAYERS：所有非玩家实体；MOBS_ONLY：只处理 Mob 生物。
scope = "ALL_NON_PLAYERS"
# 保护不能切换维度的实体（包含原版 Boss）。模组 Boss 建议另加白名单。
protectBosses = true
# 命名实体是否始终 tick。
protectNamed = false
# 驯服的动物、马是否始终 tick。
protectTamed = true
# 维度没有非旁观玩家时是否冻结符合条件的实体。
freezeWithoutPlayers = true
# 实体 ID、模组通配符和实体类型标签。例如 "create:*"、"#minecraft:raiders"。
whitelist = ["minecraft:ender_dragon", "minecraft:wither"]
